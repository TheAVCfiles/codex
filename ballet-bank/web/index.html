<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ballet Bank Paygate</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 720px; line-height: 1.4; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; margin-bottom: .5rem; }
    input { width: 100%; padding: .5rem; margin-bottom: .75rem; }
    button { padding: .6rem 1rem; cursor: pointer; }
    .muted { color: #666; font-size: .9rem; }
    #status { white-space: pre-wrap; background: #f7f7f7; padding: .75rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Ballet Bank: Paygate → Credits → Convert</h1>
  <p class="muted">Pay normally, hold SCENT off-chain, convert on demand.</p>

  <section class="card">
    <h2>1) Buy SCENT credits</h2>
    <label>Email</label>
    <input id="buyEmail" type="email" placeholder="you@studio.com" required />
    <button id="buyBtn">Create Checkout Session</button>
  </section>

  <section class="card">
    <h2>2) View Balance</h2>
    <label>Email</label>
    <input id="balanceEmail" type="email" placeholder="you@studio.com" required />
    <button id="balanceBtn">Get Balance</button>
  </section>

  <section class="card">
    <h2>3) Convert SCENT (optional)</h2>
    <label>Email</label>
    <input id="convertEmail" type="email" placeholder="you@studio.com" required />
    <label>Wallet Address</label>
    <input id="wallet" type="text" placeholder="0x..." required />
    <label>Amount (SCENT cents)</label>
    <input id="amount" type="number" min="1" step="1" placeholder="500" required />
    <button id="convertBtn">Convert via Relayer</button>
  </section>

  <h3>Status</h3>
  <pre id="status">Ready.</pre>

  <script>
    const statusEl = document.getElementById('status');

    const api = async (path, body) => {
      const resp = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Request failed');
      return data;
    };

    document.getElementById('buyBtn').addEventListener('click', async () => {
      try {
        const email = document.getElementById('buyEmail').value.trim();
        const data = await api('/api/paygate/create-checkout', { email });
        statusEl.textContent = `Checkout session created.\nRedirecting to Stripe...`;
        window.location.href = data.checkoutUrl;
      } catch (error) {
        statusEl.textContent = `Buy error: ${error.message}`;
      }
    });

    document.getElementById('balanceBtn').addEventListener('click', async () => {
      try {
        const email = document.getElementById('balanceEmail').value.trim();
        const resp = await fetch(`/api/users/${encodeURIComponent(email)}`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Fetch failed');
        statusEl.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        statusEl.textContent = `Balance error: ${error.message}`;
      }
    });

    document.getElementById('convertBtn').addEventListener('click', async () => {
      try {
        const email = document.getElementById('convertEmail').value.trim();
        const walletAddress = document.getElementById('wallet').value.trim();
        const amountCents = Number(document.getElementById('amount').value);
        const data = await api('/api/convert', { email, walletAddress, amountCents });
        statusEl.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        statusEl.textContent = `Convert error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
