name: fortress-ci

on:
  push:
    paths:
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/fortress-ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'tests/**'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt
      - name: Run tests
        run: |
          python -m unittest tests/test_structural_bid_confirmation.py tests/test_anchor_scheduler.py tests/test_forecast_learn.py
