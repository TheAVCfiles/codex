name: Demo Build

on:
  push:
    paths:
      - "data/musings.json"
      - "scripts/build_demos.py"
      - "src/templates/demo.html"

permissions:
  contents: write

jobs:
  build-demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build demos
        run: python scripts/build_demos.py
      - name: Commit site demos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/demos data/demos.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(site): refresh demo artifacts"
          git push
