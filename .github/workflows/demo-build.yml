name: demo-build

on:
  push:
    paths:
      - data/musings.json
      - scripts/build_demos.py
      - scripts/redact.py

permissions:
  contents: write

jobs:
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_demos.py
      - name: Commit demo output if changed
        run: |
          if ! git diff --quiet site/demos data/demos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/demos data/demos.json
            git commit -m "chore: refresh demos"
            git push
          fi
