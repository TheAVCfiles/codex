name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Enable Corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate
          pnpm --version
          node --version

      - name: Configure pnpm store
        run: |
          pnpm config set store-dir ~/.pnpm-store

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Turbo dry checks
        run: |
          pnpm -s turbo --version
          pnpm -s turbo run lint --dry-run
          pnpm -s turbo run build --dry-run
