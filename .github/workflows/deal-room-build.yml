name: deal-room-build

on:
  push:
    paths:
      - data/musings.json
      - scripts/build_deal_rooms.py
      - scripts/build_witness.py
      - scripts/redact.py

permissions:
  contents: write

jobs:
  rooms-and-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_deal_rooms.py
      - run: python scripts/build_witness.py
      - name: Commit room/witness output if changed
        run: |
          if ! git diff --quiet site/rooms site/witness data/deal_rooms.json data/witness_tokens.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/rooms site/witness data/deal_rooms.json data/witness_tokens.json
            git commit -m "chore: refresh deal rooms and witness"
            git push
          fi
