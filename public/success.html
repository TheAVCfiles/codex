<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Unlocked — Decision Engine</title>
  <meta
    name="description"
    content="Payment successful. Your Decision Engine access is now active."
  />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #14141d;
      --text: #f4f4f8;
      --muted: #a1a1b3;
      --accent: #a78bfa;
      --success: #86efac;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at top, rgba(167, 139, 250, 0.18), transparent 32%),
        linear-gradient(180deg, #0b0b12 0%, #09090d 100%);
      color: var(--text);
    }

    .card {
      width: min(100%, 42rem);
      padding: 2.5rem;
      border-radius: 1.25rem;
      background: linear-gradient(180deg, rgba(25, 25, 36, 0.98), rgba(15, 15, 24, 0.98));
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .eyebrow {
      color: var(--success);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    h1 {
      margin: 0.5rem 0 1rem;
      font-size: clamp(2.25rem, 6vw, 3.25rem);
      line-height: 1.1;
      font-weight: 500;
    }

    p {
      color: var(--muted);
      font-size: 1.08rem;
      margin: 0.9rem 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.3rem;
      padding: 0.9rem 1.6rem;
      border-radius: 0.9rem;
      text-decoration: none;
      font-weight: 700;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #c4b5fd);
      color: #09090d;
    }

    .btn-secondary {
      border: 1px solid var(--border);
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Payment complete</div>
    <h1>Access Unlocked</h1>
    <p>Thank you — your Decision Engine access is now active.</p>
    <p>Go back to the app, refresh, and enjoy unlimited receipts with full pattern memory.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Return to StagePort</a>
      <a class="btn btn-secondary" href="/#pricing">Review plan details</a>
    </div>
  </main>
</body>
</html>
