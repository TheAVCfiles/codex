<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Syvaq Signal — Runtime</title>
<style>
  :root {
    --bg: #03050f;
    --panel: rgba(12, 16, 34, 0.82);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #eff2ff;
    --muted: #98a2c2;
    --accent: #8b7cff;
    --success: #4ce0b3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at top, rgba(99, 102, 241, 0.18), transparent 30%),
      radial-gradient(circle at 80% 0%, rgba(94, 240, 194, 0.12), transparent 24%),
      radial-gradient(circle at top, #020617, #000);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
    padding: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .box {
    width: min(40rem, 100%);
    padding: 2rem;
    border-radius: 1.5rem;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(16px);
    box-shadow: 0 0 7.5rem rgba(99, 102, 241, 0.15);
  }

  .topline {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .eyebrow {
    margin: 0;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    font-size: 0.72rem;
  }

  .confidence {
    color: var(--success);
    font-size: 0.92rem;
    font-weight: 600;
  }

  .log {
    display: grid;
    gap: 0.75rem;
    min-height: 15rem;
  }

  .line {
    opacity: 0;
    transform: translateY(0.625rem);
    padding: 0.9rem 1rem;
    border-radius: 1rem;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--muted);
    animation: fade 0.6s forwards;
    line-height: 1.5;
  }

  .line strong {
    color: var(--text);
    font-weight: 600;
  }

  .action {
    display: none;
    margin-top: 1.5rem;
  }

  .button {
    width: 100%;
    border: 0;
    border-radius: 1rem;
    padding: 1rem 1.15rem;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #6ce6d6);
    box-shadow: 0 1rem 2.5rem rgba(99, 102, 241, 0.25);
    transition: transform 180ms ease, box-shadow 180ms ease;
  }

  .button:hover,
  .button:focus-visible {
    transform: translateY(-1px);
    box-shadow: 0 1.2rem 2.8rem rgba(99, 102, 241, 0.34);
  }

  .button:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.8);
    outline-offset: 3px;
  }

  .lock {
    margin-top: 0.75rem;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
  }

  @keyframes fade {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>
<main class="box">
  <div class="topline">
    <p class="eyebrow">Signal Runtime · Local-only execution</p>
    <div class="confidence">System Confidence: 97.2%</div>
  </div>

  <section id="log" class="log" aria-live="polite"></section>

  <div id="action" class="action">
    <button class="button" type="button" onclick="goSync()">Activate Secure Sync</button>
    <div class="lock">Protected deployment required for trusted contact routing and live escalation.</div>
  </div>
</main>

<script>
  const log = document.getElementById("log");
  const action = document.getElementById("action");
  const steps = [
    "Initializing local signal…",
    "Device context verified.",
    "Secure mode active.",
    "Monitoring behavioral pattern…",
    "Local-only execution confirmed.",
    "Signal stable.",
    "Anomaly risk: low.",
    "Response pathway ready."
  ];

  const addLine = (text) => {
    const entry = document.createElement("div");
    entry.className = "line";
    log.appendChild(entry);

    let index = 0;
    const type = () => {
      if (index < text.length) {
        entry.textContent += text[index];
        index += 1;
        window.setTimeout(type, 18);
      }
    };

    type();
  };

  const run = (index = 0) => {
    if (index >= steps.length) {
      action.style.display = "block";
      return;
    }

    addLine(steps[index]);
    window.setTimeout(() => run(index + 1), 420);
  };

  const device = `${navigator.userAgent}:${screen.width}x${screen.height}`;
  if (!localStorage.getItem("syvaq_device")) {
    localStorage.setItem("syvaq_device", device);
  }

  const goSync = () => {
    window.location.href = "sync.html";
  };

  run();
</script>
</body>
</html>
