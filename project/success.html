<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision Engine — Access Unlocked</title>
  <meta name="description" content="Stripe checkout success page for Decision Engine." />
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: #111118;
      --text: #f5f5fa;
      --muted: #a1a1b8;
      --accent: #a78bfa;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(circle at top left, rgba(167, 139, 250, 0.14), transparent 24%),
        linear-gradient(180deg, #09090d 0%, #0b0b11 45%, #111118 100%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(680px, 100%);
      padding: 2rem;
      border-radius: 1.4rem;
      background: rgba(17, 17, 24, 0.94);
      border: 1px solid var(--border);
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.42);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 1rem 0 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.5rem;
      padding: 1rem 1.4rem;
      border-radius: 0.95rem;
      text-decoration: none;
      font-weight: 800;
      color: #0d0d12;
      background: linear-gradient(135deg, var(--accent) 0%, #c084fc 100%);
      box-shadow: 0 18px 40px rgba(167, 139, 250, 0.28);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Access Unlocked</h1>
    <p>Thank you — your Decision Ledger is now active.</p>
    <p>Go back to the app, refresh, and enjoy unlimited receipts with full pattern memory.</p>
    <a class="btn" href="index.html">Return to StagePort</a>
  </main>
</body>
</html>
