<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Unlocked</title>
  <meta name="description" content="Post-checkout confirmation page for Decision Ledger unlocks." />
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --text: #f3f3f8;
      --muted: #9a9aad;
      --accent: #a78bfa;
      --success: #86efac;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top, rgba(167, 139, 250, 0.14), transparent 35%), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }

    .card {
      width: min(100%, 34rem);
      background: rgba(18, 18, 26, 0.88);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 3.3rem);
      line-height: 1.08;
      color: var(--success);
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1rem;
      min-height: 3.1rem;
      padding: 0.9rem 1.4rem;
      border-radius: 0.9rem;
      text-decoration: none;
      font-weight: 700;
      background: linear-gradient(135deg, #c4b5fd, var(--accent));
      color: #08080c;
      box-shadow: 0 18px 40px rgba(167, 139, 250, 0.25);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Access Unlocked</h1>
    <p>Thank you — your Decision Ledger is now active.</p>
    <p>Go back to the app, refresh, and enjoy unlimited receipts plus full pattern memory.</p>
    <a class="button" href="./index.html">Return to StagePort</a>
  </main>
</body>
</html>
