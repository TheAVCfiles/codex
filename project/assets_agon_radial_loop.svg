<svg width="920" height="620" viewBox="0 0 920 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agon Engine radial movement loop diagram">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="920" height="620" fill="url(#bg)"/>

  <circle cx="460" cy="310" r="210" stroke="url(#ring)" stroke-width="3" stroke-dasharray="8 10" opacity="0.8"/>
  <circle cx="460" cy="310" r="130" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>

  <line x1="460" y1="310" x2="460" y2="100" stroke="#6ee7b7" stroke-width="2" opacity="0.6"/>
  <line x1="460" y1="310" x2="660" y2="220" stroke="#6ee7b7" stroke-width="2" opacity="0.6"/>
  <line x1="460" y1="310" x2="660" y2="400" stroke="#6ee7b7" stroke-width="2" opacity="0.6"/>
  <line x1="460" y1="310" x2="460" y2="520" stroke="#6ee7b7" stroke-width="2" opacity="0.6"/>
  <line x1="460" y1="310" x2="260" y2="400" stroke="#6ee7b7" stroke-width="2" opacity="0.6"/>
  <line x1="460" y1="310" x2="260" y2="220" stroke="#6ee7b7" stroke-width="2" opacity="0.6"/>

  <circle cx="460" cy="310" r="38" fill="#111827" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/>
  <text x="460" y="316" text-anchor="middle" fill="#fef3c7" font-size="15" font-family="Inter, sans-serif">Agon Core</text>

  <g filter="url(#glow)">
    <circle cx="460" cy="100" r="26" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <circle cx="660" cy="220" r="26" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="660" cy="400" r="26" fill="#1f2937" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="460" cy="520" r="26" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="260" cy="400" r="26" fill="#3f1d2e" stroke="#f472b6" stroke-width="2"/>
    <circle cx="260" cy="220" r="26" fill="#052e16" stroke="#86efac" stroke-width="2"/>
  </g>

  <text x="460" y="70" text-anchor="middle" fill="#d1fae5" font-size="13" font-family="Inter, sans-serif">Balance Node</text>
  <text x="716" y="224" fill="#ddd6fe" font-size="13" font-family="Inter, sans-serif">Radial Memory</text>
  <text x="706" y="404" fill="#fde68a" font-size="13" font-family="Inter, sans-serif">Chaos Orbit</text>
  <text x="460" y="565" text-anchor="middle" fill="#bfdbfe" font-size="13" font-family="Inter, sans-serif">Persistence Loop</text>
  <text x="178" y="404" fill="#fbcfe8" font-size="13" font-family="Inter, sans-serif">Phrase Shift</text>
  <text x="160" y="224" fill="#bbf7d0" font-size="13" font-family="Inter, sans-serif">Governance Pulse</text>

  <path d="M245 205C320 105 600 105 675 205" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 8" opacity="0.7"/>
  <path d="M675 415C600 515 320 515 245 415" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 8" opacity="0.7"/>

  <text x="460" y="596" text-anchor="middle" fill="#e5e7eb" font-size="14" font-family="Inter, sans-serif">Resolve chaos into dynamic balance through cyclical node alignment.</text>
</svg>
