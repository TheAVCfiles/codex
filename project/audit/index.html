<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StagePort System Audit Console</title>
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #05070d; color: #e2e8f0; }
    .wrap { width: min(1100px, 94vw); margin: 2rem auto; }
    h1 { margin: 0; font-size: 2rem; }
    .panel { border: 1px solid #243042; border-radius: 12px; background: #0b1220; padding: 1rem 1.2rem; margin-top: 1rem; }
    .line { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid #1f2937; }
    .line:last-child { border-bottom: 0; }
    .muted { color: #94a3b8; }
    .pass { color: #86efac; font-weight: 600; }
    a { color: #fcd34d; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="muted"><a href="/">← Global AVC Systems</a></p>
    <h1>StagePort System Audit Console</h1>
    <p class="muted">Diligence-grade view of process integrity, controls, and export gate discipline.</p>

    <section class="panel">
      <div class="line"><span>Single Entry Point</span><span class="pass">PASS</span></div>
      <div class="line"><span>Three-Lane Routing</span><span class="pass">PASS</span></div>
      <div class="line"><span>Local-First System Boundary</span><span class="pass">PASS</span></div>
      <div class="line"><span>Export Gate Labeling</span><span class="pass">PASS</span></div>
      <div class="line"><span>Append-Only Ledger Discipline</span><span class="pass">PASS</span></div>
    </section>
  </div>
</body>
</html>
