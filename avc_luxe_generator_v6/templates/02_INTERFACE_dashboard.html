<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{CLIENT_NAME}} Operational Layer</title><link rel="stylesheet" href="../config/theme.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:16px}.m{padding:16px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1)}small{color:var(--muted)}</style></head><body><h2 style="padding:16px">Operational Layer · {{CLIENT_NAME}}</h2><div class="grid" id="modules"></div><script>fetch('./modules.json').then(r=>r.json()).then(d=>{const el=document.getElementById('modules');d.modules.forEach(m=>{const div=document.createElement('div');div.className='m';div.innerHTML=`<strong>${m}</strong><br><small>Module active</small>`;el.appendChild(div);});});</script></body></html>
