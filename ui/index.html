<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator Console</title>
    <style>
      :root {
        --bg: #050507;
        --panel: #0f1014;
        --text: #f5f3f7;
        --muted: #8a8791;
        --accent: #d6c3a3;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .card {
        max-width: 760px;
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid #1b1c22;
        border-radius: 14px;
        padding: 20px;
      }
      h1 { margin-top: 0; }
      .muted { color: var(--muted); }
      li { margin: 8px 0; }
      code {
        background: #1a1b20;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>iPhone/iPad Operator Kit</h1>
      <p class="muted">Fresh, clean, and working.</p>
      <ol>
        <li>Edit <code>/config/*.json</code></li>
        <li>Run builder</li>
        <li>Send ZIP</li>
        <li>Get paid</li>
        <li>Log it</li>
      </ol>
      <p><strong>Next move:</strong> run one real client through this today.</p>
    </main>
  </body>
</html>
