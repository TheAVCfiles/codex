name: Demo Build

on:
  workflow_dispatch:
  push:
    paths:
      - data/musings.json
      - scripts/build_demos.py

permissions:
  contents: write

jobs:
  build-demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_demos.py
      - name: Commit demos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add site/demos
          git diff --cached --quiet || git commit -m "Rebuild demo artifacts"
          git push
