name: codex-choreographer

on:
  pull_request:
    types: [opened, edited, synchronize, closed]

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: classify and sync dump
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = (pr.title || '').toLowerCase();
            const body = (pr.body || '').toLowerCase();

            let classification = 'vision';
            let labels = [];

            if (title.includes('demo') || body.includes('demo')) {
              classification = 'execution';
              labels.push('execution');
            } else if (title.includes('spec') || title.includes('doc')) {
              classification = 'documentation';
              labels.push('documentation');
            } else {
              labels.push('vision');
            }

            if (title.includes('authority') || title.includes('gating')) labels.push('governance');
            if (title.includes('translation')) labels.push('translation');
            if (title.includes('ledger')) labels.push('ledger');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels
            });

            const payload = {
              repo: `${context.repo.owner}/${context.repo.repo}`,
              pr_number: pr.number,
              title: pr.title,
              body: pr.body || '',
              branch: pr.head.ref,
              labels,
              classification,
              merged: pr.merged || false
            };

            await fetch(process.env.CODEX_SYNC_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${process.env.CODEX_SYNC_TOKEN}`
              },
              body: JSON.stringify(payload)
            });
