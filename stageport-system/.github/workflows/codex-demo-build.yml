name: codex-demo-build

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

jobs:
  build-demo:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: build demo for execution PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((l) => l.name);
            if (!labels.includes('execution')) return;

            await fetch(process.env.DEMO_BUILD_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${process.env.DEMO_BUILD_TOKEN}`
              },
              body: JSON.stringify({
                repo: `${context.repo.owner}/${context.repo.repo}`,
                pr_number: pr.number,
                title: pr.title,
                body: pr.body || ''
              })
            });
