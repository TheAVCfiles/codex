name: Deal Room Build

on:
  workflow_dispatch:
  push:
    paths:
      - "stageport-system/data/musings.json"
      - "stageport-system/scripts/build_deal_rooms.py"

permissions:
  contents: write

jobs:
  build-rooms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python stageport-system/scripts/build_deal_rooms.py
      - name: Commit deal rooms
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stageport-system/site/rooms
          git diff --cached --quiet || git commit -m "Build deal rooms"
          git push
